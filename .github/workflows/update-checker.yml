name: Update Checker

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

on:
  workflow_dispatch:
  # schedule:
  #   - cron: 0 */18 * * *

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest Commit Hash
        id: getHash
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH /tmp/lede || \
            git clone --depth 1 $REPO_URL -b $REPO_BRANCH /tmp/lede
          echo "commitHash=$(git -C /tmp/lede rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache commit hash
        id: cacheHash
        uses: actions/cache@v4
        with:
          path: .commitHash
          key: HEAD-${{ steps.getHash.outputs.commitHash }}

      - name: Save new Commit Hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: echo "${{ steps.getHash.outputs.commitHash }}" > .commitHash

      - name: Trigger build workflow
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          event-type: openwrt-build

      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const days = 1;
            const keepRuns = 1;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            const {data:runs}=await github.rest.actions.listWorkflowRuns({
              owner:context.repo.owner,
              repo:context.repo.repo,
              workflow_id:context.workflow,
              per_page:100
            });
            let delRuns=runs.workflow_runs.filter(run=>new Date(run.created_at)<cutoff);
            if(delRuns.length>keepRuns) delRuns=delRuns.slice(keepRuns);
            for(const r of delRuns){
              await github.rest.actions.deleteWorkflowRun({owner:context.repo.owner,repo:context.repo.repo,run_id:r.id});
            }

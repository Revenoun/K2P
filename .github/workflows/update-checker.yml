name: Update Checker

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 执行
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.diff.outputs.updated }}
      upstream_sha: ${{ steps.diff.outputs.upstream_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要完整历史才能正确判断

      - name: Check for updates
        id: diff
        run: |
          set -euo pipefail

          # 幂等地添加 upstream
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/coolsnowwolf/lede.git

          # 只拉 main 分支
          git fetch --no-tags upstream main

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          # 判断当前 HEAD 是否已包含 upstream/main
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "No updates found."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "New updates found! upstream=$UPSTREAM_SHA"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "### Update Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream SHA: \`${{ steps.diff.outputs.upstream_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Updated: \`${{ steps.diff.outputs.updated }}\`" >> "$GITHUB_STEP_SUMMARY"

      # ---- 邮件通知（可选，需要就取消注释并配置 secrets） ----

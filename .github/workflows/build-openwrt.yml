name: Build OpenWrt

on:
  # 允许手动触发
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否开启 SSH 连接调试 (true/false)'
        required: false
        default: 'false'
  # 当相关文件更新时自动触发编译
  push:
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - '.github/workflows/build-openwrt.yml'
  # 允许定时触发（可选，默认关闭）
  # schedule:
  #   - cron: '0 18 * * *'

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_PART1: diy-part1.sh
  DIY_PART2: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build Firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget
          sudo timedatectl set-timezone "$TZ"
          date

      - name: 克隆 OpenWrt 源码
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "当前源码版本: $(git log -1 --pretty=%h %s)"

      - name: 加载 DIY 脚本 1（feeds 相关）
        run: |
          cd openwrt
          if [ -f "../$DIY_PART1" ]; then
            echo "===== 执行 $DIY_PART1 ====="
            chmod +x "../$DIY_PART1"
            bash "../$DIY_PART1"
            echo "===== $DIY_PART1 执行完毕 ====="
          else
            echo "未找到 $DIY_PART1，跳过。"
          fi

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载 DIY 脚本 2（配置相关）
        run: |
          cd openwrt
          if [ -f "../$DIY_PART2" ]; then
            echo "===== 执行 $DIY_PART2 ====="
            chmod +x "../$DIY_PART2"
            bash "../$DIY_PART2"
            echo "===== $DIY_PART2 执行完毕 ====="
          else
            echo "未找到 $DIY_PART2，跳过。"
          fi

      - name: 加载 .config 配置文件
        run: |
          cd openwrt
          if [ -f "../$CONFIG_FILE" ]; then
            echo "===== 使用仓库中的 $CONFIG_FILE ====="
            cp "../$CONFIG_FILE" .config
          else
            echo "===== 未找到 $CONFIG_FILE，生成默认配置 ====="
            make defconfig
          fi

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: 开始编译固件
        id: compile
        run: |
          cd openwrt
          echo "开始编译，使用 $(nproc) 线程"
          make -j$(nproc) || make -j1 V=s
          echo "编译完成"

      - name: 整理编译产物
        run: |
          cd openwrt
          mkdir -p ../output
          # 复制固件文件
          find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" -o -name "*.itb" \) -exec cp {} ../output/ \; 2>/dev/null || true
          # 复制构建信息与 manifest
          cp .config ../output/config.buildinfo 2>/dev/null || true
          find bin/targets -name "*.manifest" -exec cp {} ../output/ \; 2>/dev/null || true
          echo "===== 产物列表 ====="
          ls -lh ../output/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ github.run_number }}
          path: output/
          retention-days: 7

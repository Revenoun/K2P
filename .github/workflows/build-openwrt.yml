name: Build K2P OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取 Lede 源码
        uses: actions/checkout@main
        with:
          repository: ${{ env.REPO_URL }}
          ref: ${{ env.REPO_BRANCH }}
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: DIY1：添加Aurora主题、uci-defaults、更新feeds、打默认主题补丁
        run: |
          #克隆aurora主题
          git clone https://github.com/aurora/luci-theme-aurora.git package/luci-theme-aurora
          #创建首次开机自动设置aurora为默认主题
          mkdir -p package/luci-theme-aurora/files
          cat > package/luci-theme-aurora/files/99-set-aurora-default <<'EOF'
#!/bin/sh
uci set luci.main.theme='aurora'
uci set luci.core.mediaurlbase='/luci-static/aurora'
uci commit luci
exit 0
EOF
          #写入Makefile安装uci脚本
          echo -e "\ndefine Package/luci-theme-aurora/install\n\t\$(call Package/luci/theme/install,\$(1))\n\t\$(CP) ./files/99-set-aurora-default \$(1)/etc/uci-defaults/\nendef" >> package/luci-theme-aurora/Makefile

          #更新feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          #补丁修改系统默认luci配置
          patch -p1 <<'EOF'
--- a/feeds/luci/modules/luci-base/root/etc/config/luci
+++ b/feeds/luci/modules/luci-base/root/etc/config/luci
@@ -1,6 +1,6 @@
 config core
-	option mediaurlbase '/luci-static/bootstrap'
+	option mediaurlbase '/luci-static/aurora'

 config main
 	option lang auto
-	option theme bootstrap
+	option theme aurora
EOF

      - name: 生成基础配置 + 锁定K2P(mt7621)平台
        run: |
          make defconfig
          #切换到MT7621 -> K2P
          sed -i 's/# CONFIG_TARGET_ramips is not set/CONFIG_TARGET_ramips=y/' .config
          sed -i 's/# CONFIG_TARGET_ramips_mt7621 is not set/CONFIG_TARGET_ramips_mt7621=y/' .config
          sed -i 's/# CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p is not set/CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y/' .config
          #取消其他设备
          sed -i '/CONFIG_TARGET_ramips_mt7621_DEVICE_/s/=y/# is not set/' .config
          sed -i 's/# CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p is not set/CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y/' .config

      - name: DIY2：启用Aurora主题编译
        run: |
          sed -i 's/# CONFIG_PACKAGE_luci-theme-aurora is not set/CONFIG_PACKAGE_luci-theme-aurora=y/' .config
          sed -i 's/CONFIG_PACKAGE_luci-theme-bootstrap=y/# CONFIG_PACKAGE_luci-theme-bootstrap is not set/' .config
          cat .config

      - name: 编译缓存（加速下次编译）
        uses: actions/cache@main
        with:
          path: |
            feeds
            staging_dir
            build_dir
            dl
          key: ${{ github.run_id }}

      - name: 开始编译固件
        run: |
          make -j$(nproc) V=s

      - name: 收集固件bin
        run: |
          mkdir -p firmware
          cp -r bin/targets/ramips/mt7621/*.bin firmware/
          ls firmware

      - name: 上传固件成品
        uses: actions/upload-artifact@v4
        with:
          name: K2P-Lede-Aurora-Firmware
          path: firmware

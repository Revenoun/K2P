name: Build ImmortalWrt for K2P

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            rsync unzip wget zlib1g-dev
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone source code
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt

      - name: Load custom feeds
        run: |
          if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
            chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
          fi

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          cd openwrt
          if [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ]; then
            chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
            "$GITHUB_WORKSPACE/$DIY_P2_SH"
          fi
          if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
            cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          else
            echo "错误：仓库根目录缺少 $CONFIG_FILE"
            exit 1
          fi

      - name: Generate configuration file
        run: |
          cd openwrt
          make defconfig
          grep -q 'CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y' .config || { echo "错误：K2P 目标未选中"; exit 1; }
          make download -j8 || make download -j1 V=s

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_K2P
          path: openwrt/bin/targets/*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k2p-${{ github.run_number }}
          name: ImmortalWrt K2P ${{ github.run_number }}
          body: |
            自动构建的 ImmortalWrt K2P 固件
            - 分支: ${{ env.REPO_BRANCH }}
            - 设备: phicomm_k2p
            - 提交: ${{ github.sha }}
          files: |
            openwrt/bin/targets/ramips/mt7621/*.bin
          fail_on_unmatched_files: true
          draft: false

name: Build OpenWrt

on:
  # 仅保留手动触发，不自动编译
  workflow_dispatch:

# 必须添加权限设置，否则无法创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf  python3 python3-pip qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Clone source code
        run: |
          git clone https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt

      - name: Load custom feeds
        run: |
          cd openwrt
          sed -i '$a src-git helloworld https://github.com/fw876/helloworld' feeds.conf.default
          sed -i '$a src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages' feeds.conf.default
          sed -i '$a src-git passwall https://github.com/xiaorouji/openwrt-passwall' feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          cd openwrt
          cp ../.config .config

      - name: Execute diy scripts
        run: |
          cd openwrt
          chmod +x ../diy-part1.sh ../diy-part2.sh
          bash ../diy-part1.sh
          bash ../diy-part2.sh

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      # ================= 新增：上传到 Releases =================
      - name: Create Release and Upload Firmware
        uses: softprops/action-gh-release@v1
        with:
          # 使用当前日期和时间作为标签名，例如：v2023-10-27-1530
          tag_name: v${{ github.run_number }}
          name: OpenWrt Firmware ${{ github.run_number }}
          body: |
            自动编译的 OpenWrt 固件
            编译时间: ${{ github.event.repository.updated_at }}
            提交: ${{ github.sha }}
          # 上传所有编译好的 .img.gz 文件
          files: |
            openwrt/bin/targets/*/*/*.img.gz
          # 设置为草稿 (draft)，这样您可以在发布前检查一下。如果不需要可以改为 false
          draft: false
          # 设置为预发布 (prerelease)，如果需要正式版可以改为 false
          prerelease: false
      # =======================================================

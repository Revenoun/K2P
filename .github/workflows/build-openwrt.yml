name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIYP1SH: diy-part1.sh
  DIYP2SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-dev libelf-dev swig rsync unzip zlib1g-dev file wget vim ccache
          sudo apt-get autoremove -y --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$USER /workdir
          df -hT

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIYP1SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIYP1SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIYP2SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIYP2SH

      # === 保留闭源驱动，修复内核 5.15+ 编译问题 ===
      - name: Fix mt7615d driver for kernel >= 5.15
        run: |
          cd openwrt
          DRIVER_DIR="package/lean/mt/drivers/mt7615d"

          if [ ! -d "$DRIVER_DIR" ]; then
            echo "::error::mt7615d driver directory not found"
            exit 1
          fi

          echo "=== Before fix: mt7615d related config ==="
          grep -i 'mt7615d' .config || echo "No mt7615d config found"

          # 确保闭源驱动处于启用状态
          sed -i 's/# CONFIG_PACKAGE_kmod-mt7615d is not set/CONFIG_PACKAGE_kmod-mt7615d=y/' .config
          sed -i 's/# CONFIG_PACKAGE_luci-app-mtwifi is not set/CONFIG_PACKAGE_luci-app-mtwifi=y/' .config

          # 关闭冲突的开源驱动
          sed -i '/^CONFIG_PACKAGE_kmod-mt7615e=/d' .config
          sed -i '/^CONFIG_PACKAGE_kmod-mt7615e/d' .config
          echo "# CONFIG_PACKAGE_kmod-mt7615e is not set" >> .config

          # 修复1: 为内核 >= 5.15 移除 get_fs/set_fs 调用
          # 参考: coolsnowwolf/lede commit 5654a17092
          find "$DRIVER_DIR" -name "*.c" | while read f; do
            if grep -q "set_fs\|get_fs" "$f" 2>/dev/null; then
              echo "Patching $f for kernel >= 5.15..."
              # 注释掉 set_fs 和 get_fs 调用
              sed -i 's/\bset_fs\s*(/\/\/ set_fs(/g' "$f"
              sed -i 's/\bget_fs\s*(/\/\/ get_fs(/g' "$f"
            fi
          done

          # 修复2: 补充 CONFIG_SUPPORT_OPENWRT 宏定义
          MAKEFILE="$DRIVER_DIR/Makefile"
          if [ -f "$MAKEFILE" ]; then
            if ! grep -q "CONFIG_SUPPORT_OPENWRT" "$MAKEFILE"; then
              sed -i '/EXTRA_CFLAGS/a EXTRA_CFLAGS += -DCONFIG_SUPPORT_OPENWRT=1' "$MAKEFILE"
              echo "Added CONFIG_SUPPORT_OPENWRT macro"
            fi
          fi

          # 重新生成配置
          make defconfig

          echo "=== After fix: mt7615d related config ==="
          grep -i 'mt7615d' .config || echo "No mt7615d config found"

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true'
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Download package
        run: |
          cd openwrt
          [ -f .config ] || cp defconfig .config
          make defconfig
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          set -e
          cd openwrt
          echo "=== System resources before compile ==="
          free -h
          df -hT
          echo "=== $(nproc) thread compile ==="
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "=== Compile finished ==="
          if [ ! -d "bin/targets" ]; then
            echo "::error::bin/targets not found"
            exit 1
          fi
          echo "status=success" >> $GITHUB_OUTPUT
          DEVICE_NAME=$(grep '^CONFIG_TARGET_DEVICE_.*=y' .config \
            | head -n1 \
            | sed 's/.*DEVICE_\(.*\)=y/\1/')
          DEVICE_NAME=${DEVICE_NAME:-unknown}
          echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outcome == 'success' && env.UPLOAD_BIN_DIR == 'true' && !cancelled()
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: steps.compile.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets
          if [ -z "$(ls -A)" ]; then
            echo "::error::targets directory is empty"
            exit 1
          fi
          FIRMWARE_DIR=$(find . -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [ -z "$FIRMWARE_DIR" ]; then
            echo "::error::firmware directory not found"
            exit 1
          fi
          cd "$FIRMWARE_DIR"
          rm -rf packages
          echo "FIRMWARE_DIR=$PWD"
          ls -la "$PWD"
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outcome == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Delete all existing releases and tags
        if: steps.compile.outcome == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 1000 -R ${{ github.repository }} --json tagName -q '.[].tagName' \
            | while read tag; do
                gh release delete "$tag" -R ${{ github.repository }} --yes --cleanup-tag || true
              done
          git fetch --tags
          git tag -l | while read tag; do
            git push origin :refs/tags/"$tag" || true
          done

      - name: Generate release tag
        id: tag
        if: steps.compile.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body: |
            ## OpenWrt Firmware
            Build time: ${{ steps.tag.outputs.release_tag }}
            Source: ${{ env.REPO_URL }} (${{ env.REPO_BRANCH }})
          files: |
            ${{ env.FIRMWARE }}/openwrt-*-squashfs-sysupgrade.bin
            ${{ env.FIRMWARE }}/openwrt-*-uImage-factory.bin
            ${{ env.FIRMWARE }}/sha256sums

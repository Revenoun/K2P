name: Build OpenWrt for K2P
on:
  schedule:
    - cron: '0 2 * * 5' # 每周五凌晨2点自动编译
  workflow_dispatch: # 手动触发
    inputs:
      ssh_debug:
        description: 'Enable SSH debug connection'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo bash -c 'bash <(curl -s https://raw.githubusercontent.com/P3TERX/Actions-OpenWrt/main/build-tools/ubuntu2204-install.sh)'
          sudo timedatectl set-timezone "$TZ"
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          df -hT $PWD

      - name: Setup SSH Debug
        if: github.event.inputs.ssh_debug == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: Clone source code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf $GITHUB_WORKSPACE/$CONFIG_FILE openwrt/.config
          ln -sf $GITHUB_WORKSPACE/$DIY_P1_SH openwrt/diy-part1.sh
          ln -sf $GITHUB_WORKSPACE/$DIY_P2_SH openwrt/diy-part2.sh

      # ==========修复缓存key，读取仓库根目录的配置文件==========
      - name: Cache download files
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ github.workflow }}-dlcache-${{ hashFiles('.config','diy-part*.sh') }}
          restore-keys: |
            ${{ github.workflow }}-dlcache-

      - name: Load custom feeds(diy-part1)
        run: |
          cd openwrt
          chmod +x diy-part1.sh
          ./diy-part1.sh

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration(diy-part2)
        run: |
          cd openwrt
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: (!cancelled())
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware directory
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "Phicomm K2P Firmware" >> release.txt
          echo "Build date: $(date +"%Y-%m-%d %H:%M:%S")" >> release.txt
          echo "Source: $REPO_URL" >> release.txt
          echo "Branch: $REPO_BRANCH" >> release.txt
          echo "Device: Phicomm K2P" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

      # 可选：如需保留更多日志，删除下面这段
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 2
